name: contract-freshness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
jobs:
  contract-freshness:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-contract-freshness.yml@0973e4167ff88353f3789f08ea64ff3926eb7559
    with:
      manifest-path: ".project/contracts/adoption.yaml"
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
      expect: ${{ github.event_name == 'pull_request' && 'warn' || 'current' }}
