name: contract-freshness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * 1'
permissions:
  contents: read
jobs:
  contract-freshness:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-contract-freshness.yml@184a81393a1b26d8ca3d60eed4428cefa8ab1cc2
    with:
      manifest-path: ".project/contracts/adoption.yaml"
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
      expect: ${{ github.event_name == 'pull_request' && 'warn' || 'current' }}
