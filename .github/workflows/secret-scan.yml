name: secret-scan

# ci-harness reusable gitleaks pipeline (audit 2026-09-29 P4-4). SHA-pinned.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # gitleaks-action posts a PR comment

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-secret-scan.yml@ede6c5c19baba5e72ee6200d860f84f73ec4a6d7
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
      fetch-depth: 0
