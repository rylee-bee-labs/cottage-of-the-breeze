name: secret-scan

# ci-harness reusable gitleaks pipeline (audit 2026-09-29 P4-4). SHA-pinned.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # gitleaks-action posts a PR comment

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@17e34f4758943b77a9f3c11340f92bc495a46668
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
      fetch-depth: 0
