name: secret-scan

# ci-harness reusable gitleaks pipeline (audit 2026-09-29 P4-4). SHA-pinned.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # gitleaks-action posts a PR comment

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@2766ce473a3604cc8d80198c082c14a9b8f89102
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
      fetch-depth: 0
