name: secret-scan

# ci-harness reusable gitleaks pipeline (audit 2026-09-29 P4-4). SHA-pinned.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # gitleaks-action posts a PR comment

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: Rylee-Bee/ci-harness/.github/workflows/reusable-secret-scan.yml@7e9a2d64705c4d3deaaca8ef89dac6a8f5f3d9ea
    with:
      fetch-depth: 0
