name: validate-pack

# E15: product-specific validation gate. Runs the documented VEFR pack
# validator (`norns validate`, see AGENTS.md "Commands") so an invalid
# pack fails CI. VEFR is fetched from its public repo at a pinned SHA:
# no local checkout, symlink, or personal path is assumed, so this works
# on a clean clone and on any runner.
#
# Bumping VEFR_REF is deliberate: re-run the validator locally first, so
# pack/engine drift is a conscious change rather than a surprise.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-pack-${{ github.ref }}
  cancel-in-progress: true

env:
  # The VEFR commit this pack is validated against. Bumped to merged vefr main
  # for the endless-dungeon lane: E1 play-time floors (#314), the E3 delve v3 JS
  # twin (#311), the S2 event table (#309), the floor-key stream key (#313) and
  # the E4 Sections (#332). Measured before the bump: `uv run norns validate
  # --pack worlds/cottage-of-the-breeze` against this engine prints `ok:
  # geometry, reachability, voices all pass`.
  #
  # Bumped again 2026-10-09 to b5ed13d, merged vefr main: vefr#361, books pinned
  # to a generated floor by place, chosen per run. That engine turns away a
  # `found: map` book that names its tile with `at:` on a generated floor, which
  # is what the five books on this branch now do; on the old pin they read as
  # though they had nothing to fix. The CI run on this branch is the proof.
  #
  # Bumped 2026-10-12 to f20efda, merged vefr main, for the E8d warden
  # challenges (vefr#404), the story_end stair (vefr#406) and town_states.
  #
  # Bumped 2026-10-12 to a5d2f7b, vefr main with the object layer (vefr#420:
  # props, footprints, depth, people_block) and crisp pixel art (vefr#427:
  # display.pixel_art). The GBA town on this branch needs both.
  #
  # Bumped 2026-10-13 to e29521e, merged vefr main with a Section's decor
  # (vefr#442), which the Sections on this branch need.
  #
  # Bumped 2026-10-13 to 694a875, merged vefr main where a mirrored side
  # faces left on screen and a phone drag never moves the page (vefr#444).
  #
  # Bumped 2026-10-13 to cbc8850, merged vefr main with the storybook phone
  # layout (vefr#445), whose checker knows display.look.
  #
  # Bumped 2026-10-13 to 84e61d1, merged vefr main with a desk's follow
  # camera and display.desk_tile (vefr#446).
  # Bumped 2026-10-16 to d69fcba, merged vefr main (display.ending_tile, vefr#520,
  # is available; this pack does not set it, see cottage#166).
  # Bumped 2026-10-27 to 1a03f53, merged vefr main, for the controls Rylee asked
  # to see on the real build (cottage#161): the floating joystick back for
  # phones a stale D-pad value had pinned (vefr#573), the glow and corner marks
  # on what the action button will use (vefr#527), and the desktop dock naming
  # the resident (vefr#561). Measured before the bump: `norns validate` against
  # this engine prints `ok: ... geometry, reachability, voices all pass`.
  # Bumped 2026-10-29 to 275a6ff, merged vefr main: vefr#586, the RPG core
  # (ADR 0021, Gate 1), which this pack's cellar now uses: `fight`, `traits`,
  # `curve`, a family's `guard`/`drop_chance`/`gold`, a shop's `stock`,
  # labelled verbs and the descent's `resume`/`fall`. Measured before the bump:
  # `norns validate` against this engine prints `ok: ... geometry,
  # reachability, voices all pass`.
  # Bumped 2026-10-30 to 2e78a9b, the head of vefr#591 (monster skills, ADR
  # 0024), whose family `skills` the cellar's four families now carry; it is
  # re-pinned to the merge commit once vefr#591 lands. Before that, 2f09165
  # (vefr#590, show it). Measured before the bump: `norns validate` against
  # this engine prints `ok: ... geometry, reachability, voices all pass`.
  VEFR_REF: 2e78a9b0a762684374469a1419852920b63469f2

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Validate the pack (pinned VEFR)
        run: >-
          uvx --no-progress
          --from "vefr @ git+https://github.com/rylee-bee-labs/vefr@${VEFR_REF}"
          norns validate --pack worlds/cottage-of-the-breeze

      # Neither `norns validate` nor `vefr check` can see a drop id the item
      # catalog does not name: the engine's `_drop_ids` discards it silently,
      # so a chest (or a warden) validates clean and hands over nothing. Four
      # ids the pack names — crown-seal, bell-key, lantern-key, helmet-key —
      # shipped that way with CI green (cottage#114, cottage#119). This step
      # runs the assertion over the same pack path as the validator above, so
      # a dangling name is a red build instead of an empty chest at play.
      # Stdlib-only and a second over the library; no VEFR checkout needed.
      - name: Assert every chest drop resolves to a real item
        run: python3 tests/assert_chest_drops.py

      # The tutorial's walking line is preserved text with Rylee's wording
      # (cottage#158); this keeps it naming the joystick for phone players.
      - name: Assert the tutorial walking line
        run: python3 tests/assert_tutorial_line.py
